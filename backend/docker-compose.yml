services:
  postgres:
    image: postgres:16
    container_name: cloudswitch-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloudswitch
    ports:
      - "5432:5432"
    volumes:
      - cloudswitch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres -d cloudswitch' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: cloudswitch-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: cloudswitch-backend:test
    container_name: cloudswitch-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/cloudswitch
      - REDIS_URL=redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cloudswitch-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  cloudswitch_postgres_data: